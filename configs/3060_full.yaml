# configs/3060_full.yaml — RTX 3060 12 GB full-data run.
model:
  name: "unsloth/gemma-4-E2B-it"
  revision: "4abfca14e6c6bfb5888b80288185b1243fb8d539"
  load_in_4bit: true
  use_gradient_checkpointing: "unsloth"
  max_lora_rank: 8

lora:
  r: 32
  alpha: 64
  dropout: 0.0
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  finetune_vision_layers: true
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true
  use_rslora: true
  finetune_audio_layers: false

training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  # max_steps removed — using num_train_epochs=1 (SFTConfig default) for a full pass
  # WARNING: 1 epoch = ~183,224 steps on this config (batch_size=4, grad_accum=4).
  # max_steps: 500  # old cap that truncated to 2k samples
  max_length: 8192
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  warmup_steps: 0
  lr_scheduler_type: "cosine"
  weight_decay: 0.001
  max_grad_norm: 1.0
  optim: "adamw_8bit"
  logging_steps: 10
  save_steps: 200
  eval_strategy: "steps"
  eval_steps: 200
  eval_on_start: true
  max_eval_samples_per_subset: 160
  # max_eval_samples_per_subset removed — run full evaluation
  prediction_loss_only: true
  output_dir: "data/checkpoints/full-v0"
  report_to: ["wandb"]
  remove_unused_columns: false
  dataloader_num_workers: 0
  packing: false
  eval_packing: false
  loss_masking: "response_only"
  gradient_checkpointing: true
  include_num_input_tokens_seen: "non_padding"
  save_total_limit: 3
  metric_for_best_model: "mean_total_loss"
  greater_is_better: false
  load_best_model_at_end: true
  seed: 3407
  data_seed: 42
  per_device_eval_batch_size: 16
  eval_accumulation_steps: 1
  validation_subsets:
    - "fineweb-edu"
    - "densefusion"
    - "smoltalk"
    - "librispeech"

dataset:
  num_proc: 4
  path: "data/materialized/univi-3M-v0-split"
  max_train_images: 4
  revision: "5e05ffab5742acce5cb9a1c0e9ba2fc2cb35c375"
  hf_hub_repo_id: "hungphongtrn/univi-3M-v0"
  subsets:
    - "fineweb-edu"
    - "densefusion"
    - "smoltalk"
    - "librispeech"
  train_splits:
    fineweb-edu: ["train"]
    librispeech: ["train"]
    densefusion: ["train"]
    smoltalk: ["train"]
  validation_splits:
    fineweb-edu: ["validation"]
    librispeech: ["validation"]
    densefusion: ["validation"]
    smoltalk: ["validation"]
  shuffle_seed: 42

# W&B — credentials auto-detected (wandb login, WANDB_API_KEY, WANDB_API_KEY_FILE).
# Falls to disabled mode (no-op) when no credentials are available.
wandb:
  project: "univi-gemma4"
  run_name_template: "full-v0_{config_hash_short}"

smoke:
  max_steps: 10
  dataset_path: "data/materialized/smoke-v1"
  output_dir: "data/checkpoints/full-smoke-v0"
  run_name_template: "full-smoke-v0_{config_hash_short}"

hub:
  model_repo_id: "hungphongtrn/univi-phase0-full-model-v0"
