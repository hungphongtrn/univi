# configs/3060_full.yaml — RTX 3060 12GB full-data run with Unsloth optimizations.
# Differences from full.yaml (A100 config):
#   - per_device_train_batch_size: 1 (12GB cannot fit batch 2 at seq 2048)
#   - max_seq_length: 1536 (reduced to fit vision embeddings + text)
#   - LoRA r: 16 (save memory vs r32, still effective for fine-tuning)
#   - gpu_memory_utilization: 0.85 (use more of the 12GB)
#   - float8_kv_cache: true (Ampere+, saves KV cache memory)
#   - unsloth_tiled_mlp: true (Ampere+, speeds up MLP)

model:
  name: "unsloth/gemma-4-E2B-it"
  load_in_4bit: true
  use_gradient_checkpointing: true
  max_seq_length: 1536
  gpu_memory_utilization: 0.85
  float8_kv_cache: true
  unsloth_tiled_mlp: true

lora:
  r: 16
  alpha: 32
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  finetune_vision_layers: true

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  max_steps: 500
  max_seq_length: 1536
  learning_rate: 2.0e-4
  warmup_steps: 20
  lr_scheduler_type: "cosine"
  optim: "adamw_8bit"
  logging_steps: 10
  save_steps: 100
  output_dir: "data/checkpoints/3060-full-v0"
  report_to: "none"
  remove_unused_columns: false
  dataloader_num_workers: 2

dataset:
  path: "data/materialized/full-v0"
  hf_hub_repo_id: "hungphongtrn/univi-phase0-dataset-full-v0"

hub:
  model_repo_id: "hungphongtrn/univi-phase0-3060-full-model-v0"