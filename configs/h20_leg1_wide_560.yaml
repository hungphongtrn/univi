# configs/h20_leg1_wide_560.yaml
# H20 — LEG 1 of the two-leg wide-render design: 2000x160 @ 560 soft tokens.
#
# Spec: docs/hypothesis/todo/H20-audio-phoneme-resolution.md
# Prep measurements: data/eval/h20-wide-verify.json, data/eval/h20-lane-audit.json
#
# ===========================================================================
# THE INVARIANT: h20_leg1_wide_560.yaml and h20_leg2_wide_1120.yaml are
# identical except for
#   - model.max_soft_tokens                                  (560 / 1120)  <- the variable
#   - training.output_dir, wandb.run_name                    (bookkeeping)
#   - per_device_*_batch_size / gradient_accumulation_steps  (VRAM only —
#     EFFECTIVE BATCH STAYS 64 in both legs, which is the real invariant and
#     matches H07/H09/H13/H14/H16/H17 exposure)
# Anything else that differs makes the leg-1-vs-leg-2 attribution void.
# ===========================================================================
#
# WHAT THIS LEG IS FOR. On the WIDE 2000x160 render, budget 560 gives a
# 83 x 6 patch grid: 120.5 ms per token-column with **13.3 mel bins per cell —
# byte-identical frequency granularity to today's production 1000x160 @ 280
# (41 x 6, 13.3 mel bins/cell)**. The 2x horizontal stretch and the 2x budget
# cancel exactly on the frequency axis, so the ONLY quantity that changes
# against H09/H10 is the time extent of one soft token: 243.9 -> 120.5 ms,
# a 2.02x refinement. It is the only single-variable arm this design admits.
#
# MEASURED ON REAL WIDENED PAGES (scratchpad/h20_wide_verify.py, CPU, real
# Gemma4UnifiedImageProcessor, both lanes, 100% of probed pages identical):
#
#   render     budget  grid    tokens/page  ms/column  mel bins/cell
#   1000x160     280   41 x  6      246       243.9        13.3   <- H09/H10 today
#   2000x160     280   59 x  4      236       169.5        20.0
#   2000x160     560   83 x  6      498       120.5        13.3   <- THIS LEG
#   2000x160    1120  118 x  9     1062        84.7         8.9   <- leg 2
#   1000x160    1120   83 x 13     1079       120.5         6.2   <- DOMINATED
#
# The last row is the arm configs/h20_librispeech_1120.yaml runs: same
# 120.5 ms/column as this leg, at 1079 tokens/page instead of 498. This leg is
# 2.17x cheaper per page for the identical time resolution. Do not launch that
# file.
#
# WHY A WIDER PAGE IS NOT RESIZED AWAY: the processor targets constant AREA
# (s = sqrt(B*48^2/(H*W))), so grid columns = sqrt(B * W/H) and the token count
# is ~B whatever the aspect ratio. The critical width at height 160 is 3,984 px
# at budget 280; 2000 is nowhere near it. Widening therefore moves ms/column
# exactly as hard as the budget does, AT NO TOKEN COST.
#
# ---------------------------------------------------------------------------
# PRE-REGISTERED READ — Delta-perm / Delta-blank / reading gain, NEVER eval CE
# ---------------------------------------------------------------------------
#   Confirms (per the H20 doc):
#     * position-0 reading gain > +10 pts on librispeech (H10 measured -12.7)
#     * Delta-blank >= +30%
#     * greedy decodes show NONZERO word-level overlap with targets
#       (H09 measured zero -- the model tracked utterance duration only)
#   Refutes: no phonetic correspondence at leg 2's 84.7 ms/column. Leg 1 alone
#     refutes nothing -- a flat leg 1 with a confirming leg 2 means the gain
#     needed the extra tokens or the finer frequency axis, which this design
#     cannot separate. Say so; do not attribute it to time.
#
#   Read-out (probes, not eval CE):
#     scratchpad/hybrid_pretrained_ablation.py    (Delta-perm / Delta-blank)
#     scratchpad/hybrid_4lane_position_decay.py   (position-0 reading gain)
#     scratchpad/hybrid_4lane_generate.py         (greedy decodes / word overlap)
#   Do NOT pass --max-soft-tokens: every probe defaults to the CHECKPOINT's
#   recorded budget, and overriding it reads pixels at a geometry the model
#   never trained on.
#
#   *** PASS --max-length 8192 TO EVERY PROBE. *** The probes default to 2048.
#   MEASURED at budget 560 on this root: 2048 retains 104,009 of 104,014
#   librispeech train rows and 2,683 of 2,703 validation rows -- a small but
#   silent loss, concentrated on the LONGEST utterances, i.e. exactly the rows a
#   time-resolution hypothesis cares about. (At leg 2's 1120 the same default
#   drops 80.24% of the train lane.) 4096+ retains 100.00% everywhere here.
#
#   Launch SOLO (never alongside another GPU job -- the encoder-free host-RAM OOM):
#     HF_HUB_OFFLINE=1 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#     nohup uv run python -m univi.hybrid.train_pretrained \
#       --config configs/h20_leg1_wide_560.yaml \
#       > data/checkpoints/h20-leg1-wide-560-v0-run.log 2>&1 &

model:
  vision_source: "google/gemma-4-12B-it"          # config only (cached)
  text_source: "unsloth/Qwen3-1.7B"               # pretrained Qwen3 decoder
  vision_weights: "data/hybrid/gemma12b-vision/vision_embedder.pt"

  # ---- THE VARIABLE --------------------------------------------------------
  # 560 on the 2000x160 render EMITS 498 soft tokens (83 x 6), max position id
  # (82, 5), page resized 2000x160 -> 3984x288. Budget and emitted count are
  # different numbers; 498 is what the sequence costs.
  max_soft_tokens: 560
  # --------------------------------------------------------------------------

  # ---- WARM-START ----------------------------------------------------------
  # H08's audio-reading checkpoint: pretrained Gemma-12B vision + adapter +
  # Qwen3, trained on prior-proof spoken digits with TRAINABLE vision, which
  # read at Delta-perm +134.8% / reading gain +17.6 pts. It is the ONLY
  # checkpoint in the repo whose vision tower has adapted to SPECTROGRAM
  # statistics -- and H08's whole finding is that frozen (Gemma-pretrained)
  # vision features do not encode spectrograms at all, because they are OOD.
  # Starting a cold adapter here would re-run the bootstrap lottery H13 lost.
  #
  # VERIFIED CPU-side (no GPU, no weights on a device): the checkpoint holds
  # 322 tensors with a key set and shapes BYTE-IDENTICAL to
  # hybrid-pretrained-randstr-v0/final, which H17 already verified loads at
  # 280/560/1120. NO TENSOR IS SHAPED BY max_soft_tokens.
  # vision_tower.pos_embedding is (1120, 2, 3840) at every budget -- that 1120
  # is mm_posemb_size, the position-index TABLE, not the soft-token budget.
  #
  # OOD HANDICAP, recorded before the run: the warm start trained a 41 x 6 grid
  # (position ids x<=40, y<=5). This leg runs 83 x 6, so the FREQUENCY position
  # rows are exactly the ones it trained, and only time rows 41-82 are at their
  # pretrained Gemma values. Leg 2 (118 x 9) is OOD on both axes. Leg 1 is the
  # cleaner arm here too.
  init_from: "data/checkpoints/hybrid-pretrained-spokendigits-trainvis-v0/final"

dataset:
  num_proc: 4
  source: "local"
  # WIDE RENDER, built by data/preprocessing/widen_audio_pages.py (CPU, image
  # space, no audio corpus): both lanes re-materialized 1000x160 -> 2000x160
  # with PIL LANCZOS, the renderer's own filter. At the production 10 ms hop the
  # page is already 1 render pixel per mel frame, so the extra width is
  # interpolation EITHER WAY: widening the stored page and re-rendering the mel
  # at output_width 2000 differ by 0.727% of the page's own sd (measured on 7
  # real LibriSpeech pages by --self-test; H20 reports 0.72% by an independent
  # path). This is a REALLOCATION OF THE TOKEN GRID, not new optical detail --
  # and no new detail is needed, since every axis is already upsampled at 280.
  path: "data/materialized/h20-audio-wide-v0"
  # librispeech TRAIN tops out at 3 pages; VALIDATION reaches 4. 4 keeps every
  # row of both splits.
  max_train_images: 4
  subsets:
    - "librispeech"
    - "spoken-digits"
  # NO train_splits: block. It is read only by univi.trainer._load_hub; with
  # source: local the training splits come from the manifest's
  # is_training_split flag and _load_local never looks at it (H14 finding #5 --
  # the train_splits blocks in h13_density.yaml and hybrid_pretrained_randstr
  # .yaml are inert). validation_splits IS read, by _load_eval_datasets.
  validation_splits:
    librispeech: ["validation"]
    spoken-digits: ["validation"]

training:
  output_dir: "data/checkpoints/h20-leg1-wide-560-v0"

  # ---- VRAM ----------------------------------------------------------------
  # Estimated on H17's calibrated model (data/eval/h17-config-verification.json:
  # 1.778B params bf16 + bf16 grads + AdamW8bit = 9.93 GiB static, 0.9 GiB CUDA
  # context, logits at 12 B/element over a 151,670 vocab, decoder activations
  # 1.833e-4 GiB per micro-batch token), fed with THIS leg's measured worst-case
  # sequence -- found by scoring EVERY row of the split, not by sampling:
  # 3 pages x 498 + 151 target + 21 scaffold = 1666 tokens.
  #   per-device 1 -> 14.1 GiB   2 -> 17.2 GiB   4 -> 23.5 GiB   8 -> 36.0 GiB
  # 2 is chosen. 4 fits the nominal 26 GB ceiling but NOT the ~23.9 GB actually
  # free while another container holds ~16.1 GB of the 40 GB card.
  #
  # THE MODEL IS NOT A MEASUREMENT. Its own calibration anchors disagree with
  # observed peaks by up to 7 GB (H13 predicted 20.05 / observed ~21; H14
  # predicted ~14.8 / observed 21.9). Watch nvidia-smi over the first ~20 steps
  # and halve per-device (doubling accum) if peak passes 23 GB.
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 32    # effective batch 64 -- THE INVARIANT
  # Eval has no gradient-checkpointing relief AND runs a second no-grad blank
  # forward (log_blank_ce). The 64 rows the trainer will ACTUALLY draw were
  # reproduced exactly (filters + shuffle(seed=42).select(64)): {1 page: 48,
  # 2: 13, 3: 3}, longest 1625 tokens => 17.04 GiB at per-device 2. The
  # whole-split worst is a 4-page row at 4 x 498 + 167 + 21 = 2180.
  per_device_eval_batch_size: 2
  # --------------------------------------------------------------------------

  num_train_epochs: 20               # inert; max_steps governs
  # 600 is the BOTTOM of the doc's pre-registered 600-800 band, taken because
  # leg 2 must run at micro-batch 1 and both legs must match exposure.
  # 600 x 64 = 38,400 rows against 122,369 train rows = 0.31 epochs, so no row
  # is seen twice and memorization is not a confound. H07 reached Delta-perm
  # +114.7% in exactly 600 steps at effective batch 64.
  max_steps: 600

  # TRAINABLE VISION IS NOT OPTIONAL (H08): with the vision tower frozen the
  # spoken-digit lane sat flat at the floor and never read -- spectrograms are
  # out-of-distribution for Gemma's vision pretraining, so frozen features do
  # not encode them and no adapter can recover it. These three LRs are exactly
  # the run that DID read audio (hybrid_pretrained_spokendigits_trainvis).
  freeze_vision: false
  lr_adapter: 3.0e-4                 # from-scratch bridge — fastest
  lr_vision:  1.0e-4                 # pretrained Gemma embedder — OOD adaptation
  lr_decoder: 2.0e-5                 # pretrained Qwen3 — refine, don't overwrite

  # ---- H16 blind branch: INSTRUMENTATION ONLY ------------------------------
  # DEVIATION FROM THE H20 DOC, RECORDED BEFORE RESULTS. The Design section asks
  # for "gap-weighted loss from H16". H16 is still TODO -- it has never been
  # run, so nothing is known about what it does to a training trajectory.
  # Enabling it would put an UNVALIDATED objective change into the same run as
  # the render change, and leg 1's entire claim is that exactly one variable
  # moves. If leg 1 then came back flat, the render and the objective would be
  # inseparable. So:
  #   gap_weighted_loss: false  -- the loss is stock per-token CE, as in
  #                                H07/H08/H09/H13/H14/H17
  #   log_blank_ce:      true   -- pure MEASUREMENT. With gap_weighted_loss off,
  #                                compute_loss returns the stock path on its
  #                                first line during training (no blank forward,
  #                                no gradient effect); only EVAL runs the extra
  #                                no-grad blank pass.
  # What it buys: eval_aligned_ce / eval_blank_ce / eval_prior_gap_ce /
  # eval_blank_ce_inflation at every eval -- the live H04 soft-prompt-collapse
  # guard. PRE-REGISTERED KILL: if eval_blank_ce_inflation passes +0.10 the
  # model is being made WORSE BLIND rather than BETTER SIGHTED and the run is
  # VOID. Run H16 as its own hypothesis if it is wanted.
  gap_weighted_loss: false
  log_blank_ce: true
  # --------------------------------------------------------------------------

  # MEASURED, not guessed, through the real univi.trainer._filter_training_tokens
  # with per_image_tokens = univi.trainer.image_token_budget(560) = 562, and the
  # real HybridCollator on real widened rows. The filter estimates a row as
  # original_token_length + n_images*562 + 256 and SILENTLY DROPS overflow.
  # Worst filter estimate is on librispeech VALIDATION (4 pages, stored otl 146):
  # 146 + 4*562 + 256 = 2650. Worst ASSEMBLED sequence is 2180 (4 x 498 + 167
  # + 21). 8192 retains 100.00% of all four splits and can never truncate.
  # It costs nothing at run time -- HybridCollator pads to the BATCH max, not to
  # max_length -- so it is pure insurance against the failure mode where a
  # truncated placeholder run raises "Image placeholder count != projected soft
  # tokens".
  #
  # LATENT DEFECT, recorded: original_token_length on the audio lanes was
  # written by a GEMMA tokenizer and UNDER-COUNTS the Qwen3 length the collator
  # actually produces -- by up to 20 tokens on librispeech train and 26 on
  # validation (measured over all 106,717 rows, data/eval/h20-lane-audit.json).
  # Harmless at 8192 against a 2180-token worst case; it would NOT be harmless
  # at a tight max_length, where the filter could retain a row the collator then
  # truncates. Do not tighten max_length on these lanes without re-measuring.
  max_length: 8192

  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"
  gradient_checkpointing: true
  loss_masking: "response_only"

  # Collation is CPU-bound and NOT free on this lane: one 2000x160 page at 560
  # costs ~92 ms/row to process (~141 ms at 1120), and emit_blank_images (which
  # log_blank_ce switches on) DOUBLES it -- the collator builds blank tensors on
  # every TRAINING batch even though, with gap_weighted_loss off, training
  # discards them. At effective batch 64 that is ~12 s/step of pure collation if
  # it is not overlapped. 2 workers hide it behind the GPU step. Kept low on
  # purpose: host RAM on this box has run to swap before (the encoder-free OOM),
  # and this run must be SOLO anyway.
  dataloader_num_workers: 2

  do_eval: true
  validation_subsets:                # per-lane eval_<lane>_loss; spoken-digits
    - "librispeech"                  # is the ANCHOR -- if it degrades, the run
    - "spoken-digits"                # is losing audio reading it already had.
  max_eval_samples_per_subset: 64
  eval_steps: 50                     # trajectory ONLY -- eval CE is not the criterion
  save_steps: 100                    # the probes need CHECKPOINTS, not eval losses
  save_total_limit: 7
  logging_steps: 10

wandb:
  project: "univi-encoder-free"
  run_name: "h20-leg1-wide560-120ms-per-column"
  tags: ["hybrid", "pretrained-vision", "trainable-vision", "audio", "librispeech",
         "wide-render", "h20", "leg1", "warm-start"]
