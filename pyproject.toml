[project]
name = "univi"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12.0, <3.14.0"
dependencies = [
    "datasets>=2.14.0",
    "librosa>=0.10.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "soundfile>=0.12.0",
    "torch==2.10.0+cu130",
    "torchvision==0.25.0+cu130",
    "torchcodec==0.10",
    # Training deps (GPU machine only; CPU-safe imports verified separately)
    "accelerate>=1.5.0",
    "bitsandbytes>=0.45.0",
    "huggingface-hub>=0.30.0",
    "peft>=0.15.0",
    "scipy>=1.15.0",
    "sentencepiece>=0.2.0",
    "transformers>=4.48.0",
    "trl>=0.16.0",
    "unsloth>=2025.3",
    "unsloth-zoo>=2026.7.2",
    "wandb>=0.28.0",
    "flash-linear-attention[cuda]>=0.5.1",
    "flash-attn",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.0/flash_attn-2.8.3+cu130torch2.10-cp312-cp312-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_gpu: marks GPU-dependent tests (skip if no CUDA GPU)",
]
